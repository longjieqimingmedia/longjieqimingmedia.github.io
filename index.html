<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启明心理学 - 开创未来，点亮人生</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 3.8rem;
            color: #d92121;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1.9rem;
            color: #2d2d2d;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .tip {
            font-size: 1.6rem;
            color: #444;
            margin-bottom: 45px;
        }
        .qrcode-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 35px;
        }
        .qrcode-card img {
            width: 240px;
            height: 240px;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }
        .qrcode-desc {
            margin-top: 18px;
            font-size: 1.15rem;
            color: #666;
        }
        .action-btn {
            display: inline-block;
            padding: 16px 45px;
            background-color: #d92121;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            background-color: #b81c1c;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(217, 33, 33, 0.25);
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            .subtitle {
                font-size: 1.5rem;
            }
            .tip {
                font-size: 1.3rem;
            }
            .qrcode-card img {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>启明心理学</h1>
        <p class="subtitle">开创未来，点亮人生</p >
        <p class="tip">扫码获取完整内容</p >

        <div class="qrcode-card">
            < img src="https://your-qrcode-link.png" alt="解锁码二维码">
            <p class="qrcode-desc">微信/支付宝扫码，立即解锁完整电子书</p >
        </div>

        <a href=" " class="action-btn">立即解锁</a >
    </div>
</body>
</html>
